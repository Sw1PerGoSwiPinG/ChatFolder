<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChatFolder</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header>
    <div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5h6l2 2h8v11H4z"/><path d="m9 11 3 3 3-3"/></svg></span><div><h1>ChatFolder</h1><p>让长对话更易浏览</p></div></div>
    <span id="version" class="version"></span>
  </header>
  <main>
    <section class="auto-folding" aria-label="自动收起设置">
      <label class="setting"><strong>自动收起新回答</strong><input id="defaultCollapsed" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label>
    </section>
    <section class="conversation" aria-label="AI 回答折叠">
      <label class="setting"><strong>折叠 AI 回答</strong><input id="enabled" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label>
      <p id="status" role="status" aria-live="polite">正在连接页面…</p>
      <div class="actions"><button id="collapse" type="button" disabled>全部收起</button><button id="expand" type="button" disabled>全部展开</button></div>
    </section>
    <section class="user-folding" aria-label="用户输入折叠">
      <label class="setting"><strong>折叠用户输入</strong><input id="userEnabled" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label>
      <div class="line-setting"><label for="userLines">收起后显示</label><span><input id="userLines" type="number" min="1" step="1" value="1" inputmode="numeric">行</span></div>
      <div class="actions"><button id="collapse-users" type="button" disabled>全部收起</button><button id="expand-users" type="button" disabled>全部展开</button></div>
    </section>
    <p id="error" role="alert" hidden></p>
  </main>
  <footer><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m8 1.5 5 2v4c0 3-5 6-5 6s-5-3-5-6v-4z"/><path d="m5.5 7.5 1.5 1.5 3-3"/></svg>仅在本地处理</footer>
  <script src="../build/popup/popup.js"></script>
</body>
</html>
